name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evently
          POSTGRES_PASSWORD: evently_test_only
          POSTGRES_DB: evently_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evently -d evently_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evently:evently_test_only@localhost:5432/evently_test
      NODE_ENV: test
      SESSION_SECRET: ci-only-session-secret-not-for-deployment
      APP_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.4
      - run: npm --version
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - name: Verify the isolated PostgreSQL test target
        run: npm run db:verify-test-target --workspace @evently/api
        env:
          EVENTLY_INTEGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Check database migrations from an empty database
        run: npm run db:migrate --workspace @evently/api
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
        env:
          EVENTLY_INTEGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run automated browser tests
        run: npm run test:e2e
        env:
          EVENTLY_E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify migrations are idempotently recorded
        run: npm run db:migrate --workspace @evently/api
